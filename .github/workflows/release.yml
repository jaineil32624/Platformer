name: Release builds

# Push a tag like v1.0.0 (or push to the `release` branch) to build desktop
# installers and an Android APK and attach them to a GitHub Release.
on:
  push:
    tags: ['v*']
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create (e.g. v1.0.0)
        default: v1.0.0
        required: true

env:
  VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm run build
      - run: npx electron-builder --publish never ${{ matrix.os == 'windows-latest' && '--win' || '--mac' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci || npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build
      - run: '[ -d android ] || npx cap add android'
      - run: npx capacitor-assets generate --android || true
      - run: node scripts/configure-native.mjs
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LumenLeap-${{ env.VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: LumenLeap-*.apk

  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    # Publish whatever built successfully, even if one platform failed.
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Lumen Leap ${{ env.VERSION }}
          body: |
            **Android:** download `LumenLeap-${{ env.VERSION }}.apk` on your phone, open it and allow "install unknown apps".
            **Windows / macOS:** download the installer for your computer below.
            **iPhone / web:** play in the browser and use Share → Add to Home Screen.
          files: out/**/*
          fail_on_unmatched_files: false
